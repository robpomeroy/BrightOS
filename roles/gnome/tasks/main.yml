# code: language=ansible
---
- name: Include task list appropriate for OS family (Debian/RedHat)
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] }}.yml"  

- name: Enable GDM's automatic login feature
  community.general.ini_file:
    path: "/etc/gdm{{ (ansible_facts['os_family'] == 'RedHat') | ternary('', '3') }}/custom.conf"
    section: daemon
    option: AutomaticLoginEnable
    value: "True"
    no_extra_spaces: yes
    mode: "0644"

- name: Suppress gnome-initial-setup application
  community.general.ini_file:
    path: "/etc/gdm{{ (ansible_facts['os_family'] == 'RedHat') | ternary('', '3') }}/custom.conf"
    section: daemon
    option: InitialSetupEnable
    value: "False"
    no_extra_spaces: yes
    mode: "0644"

- name: Enable automatic login for BrightOS user
  community.general.ini_file:
    path: "/etc/gdm{{ (ansible_facts['os_family'] == 'RedHat') | ternary('', '3') }}/custom.conf"
    section: daemon
    option: AutomaticLogin
    value: "{{ bos_user }}"
    no_extra_spaces: yes
    mode: "0644"

- name: Disable Gnome Initial Setup screen
  community.general.ini_file:
    path: /etc/xdg/autostart/gnome-initial-setup-first-login.desktop
    section: Desktop Entry
    option: X-GNOME-Autostart-enabled
    value: "false"
    owner: root
    group: root
    mode: "0644"
    no_extra_spaces: yes

# The applications listed may or may not be installed (depending on distro)
- name: Check whether optional desktop entries exist
  ansible.builtin.stat:
    path: "/usr/share/applications/{{ gnome_app }}"
  loop:
    - byobu.desktop
    - info.desktop
    - vim.desktop
  loop_control:
    loop_var: gnome_app
  register: gnome_optional_desktop_entries

- name: Hide unnecessary application icons
  ansible.builtin.lineinfile:
    path: "/usr/share/applications/{{ gnome_app.item }}"
    regexp: '^NoDisplay='
    insertafter: '^\[Desktop Entry\]'
    line: 'NoDisplay=true'
    mode: "0644"
  loop: "{{ gnome_optional_desktop_entries.results }}"
  loop_control:
    loop_var: gnome_app
  when: gnome_app.stat.exists

# Not strictly Gnome-related, but no need for a separate role just for this
- name: Create /etc/X11/xorg.conf.d directory
  ansible.builtin.file:
    path: /etc/X11/xorg.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Disable switching virtual terminals
  ansible.builtin.copy:
    src: 10-xorg.conf
    dest: /etc/X11/xorg.conf.d/10-xorg.conf
    owner: root
    group: root
    mode: "0644"
