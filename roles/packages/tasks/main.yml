# code: language=ansible
---
####################
# fzf dependencies #
####################

# Note: fzf depends on perl and git. The installation needs tar, go and curl.
# fzf itself is installed via the OS-specific files
- name: Install fzf dependencies
  ansible.builtin.package:
    name:
      - "{{ 'curl' if ansible_facts['os_family'] == 'Debian' else 'curl-minimal' }}"
      - git
      - golang
      - perl
      - tar

########################
# OS-specific packages #
########################

- name: Include task list appropriate for OS family (Debian/RedHat)
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] }}.yml"

# This must run after the OS-specific include (which runs fzf installer) so that
# our custom .fzf.bash overwrites any file written by fzf's own install script.
- name: Copy .fzf.bash for root and playbook users
  ansible.builtin.copy:
    src: "{{ ansible_facts['os_family'] }}.fzf.bash"
    dest: '{{ packages_fzf }}/.fzf.bash'
    mode: "0644"
  loop: "{{ ['/root', ('/root' if (playbook_user | default(ansible_facts['user_id'])) == 'root' else '/home/' ~ (playbook_user | default(ansible_facts['user_id'])))] | unique }}"
  loop_control:
    loop_var: packages_fzf

# [ -f ~/.fzf.bash ] && source ~/.fzf.bash
- name: Ensure fzf.bash is loaded for root and playbook user
  ansible.builtin.lineinfile:
    path: "{{ packages_fzf }}/.bashrc"
    # Double backslashes needed, since backslash is a special character in YAML
    regexp: "\\[ -f ~/\\.fzf\\.bash \\] && source ~/\\.fzf\\.bash"
    line: "[ -f ~/.fzf.bash ] && source ~/.fzf.bash"
  loop: "{{ ['/root', ('/root' if (playbook_user | default(ansible_facts['user_id'])) == 'root' else '/home/' ~ (playbook_user | default(ansible_facts['user_id'])))] | unique }}"
  loop_control:
    loop_var: packages_fzf


###############################################
# Packages with same names on all OS families #
###############################################

- name: Install common packages (available for all OS families)
  ansible.builtin.package:
    name:
      - htop           # Superior to top: https://github.com/htop-dev/htop
      - plocate          # File finder (replaces mlocate on all supported distros)
      - python3          # Keeps Python up to date
      - python3-pip      # Keeps Pip up to date
      - python3-psutil   # Required, to Ansible manage dconf
      - tmux           # "terminal multiplexer": https://github.com/tmux/tmux

- name: Check whether htop desktop entry exists
  ansible.builtin.stat:
    path: /usr/share/applications/htop.desktop
  register: packages_htop_desktop

- name: Hide htop application icon
  ansible.builtin.lineinfile:
    path: /usr/share/applications/htop.desktop
    regexp: '^NoDisplay='
    insertafter: '^\[Desktop Entry\]'
    line: 'NoDisplay=true'
    mode: "0644"
  when: packages_htop_desktop.stat.exists


##########################
# Virtual machine agents #
##########################

# - VMware ESXi   -> "VMware"
# - Qemu          -> "kvm"
# - VirtualBox    -> "virtualbox"

- name: Install VMware tools
  ansible.builtin.package:
    name: [open-vm-tools, open-vm-tools-desktop]
  when:    # implicit AND when passing a list
    - ansible_facts['virtualization_role'] == "guest"
    - ansible_facts['virtualization_type'] == "VMware"

- name: VirtualBox guest utils
  when:    # implicit AND when passing a list
    - ansible_facts['virtualization_role'] == "guest"
    - ansible_facts['virtualization_type'] == "virtualbox"
    - ansible_facts['distribution'] == "Ubuntu"    # packages are not available for AlmaLinux
  block:
    - name: Install VirtualBox guest utils
      ansible.builtin.package:
        name: [
          "virtualbox-guest-utils",
          "virtualbox-guest-x11",
        ]
    - name: Activate VirtualBox guest utils kernel modules (otherwise we'd have to reboot)
      community.general.modprobe:
        name: "{{ packages_vbox }}"
      loop:
        - "vboxguest"
        - "vboxsf"
        - "vboxvideo"
      loop_control:
        loop_var: packages_vbox


- name: QEMU agent
  when:    # implicit AND when passing a list
    - ansible_facts['virtualization_role'] == "guest"
    - ansible_facts['virtualization_type'] == "kvm"
  block:
    - name: Install QEMU agent
      ansible.builtin.package:
        name: [qemu-guest-agent]
        
    # The guest agent needs the virtio channel provided after a full power
    # cycle. Guard service start on the channel path to avoid first-run
    # transient failures.
    - name: Check whether QEMU guest agent virtio channel exists
      ansible.builtin.stat:
        path: /dev/virtio-ports/org.qemu.guest_agent.0
      register: packages_qga_channel

    - name: Enable QEMU guest agent service
      ansible.builtin.service:
        name: qemu-guest-agent
        enabled: true

    - name: Start QEMU guest agent service
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
      when: packages_qga_channel.stat.exists

- name: Populate service facts
  ansible.builtin.service_facts:
  changed_when: false

# hv_kvp_daemon isn't needed (usually) and causes a delay on VM boot
- name: Disable Hyper-V Key Value Pair daemon
  ansible.builtin.service:
    name: hv-kvp-daemon
    enabled: false
    state: stopped
  when: ansible_facts.services['hv-kvp-daemon.service'] is defined
