---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ system_hostname | default('vm-runner') }}"
  when:
    - ansible_facts['virtualization_type'] is not defined or ansible_facts['virtualization_type'] not in ['docker', 'containerd', 'podman']

