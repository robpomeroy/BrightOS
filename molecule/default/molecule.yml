---
dependency:
  name: galaxy
  enabled: false
driver:
  name: vagrant
  provider:
    name: hyperv
lint: |
  set -e
  yamllint .
  ansible-lint -x no-loop-var-prefix,command-instead-of-module,package-latest
platforms:
  # Hyper-V provider documentation:
  # https://developer.hashicorp.com/vagrant/docs/providers/hyperv
  # Note: Vagrant will prompt for the Hyper-V virtual switch name on first 'vagrant up'
  # To avoid the prompt, add provider_raw_config_args (see commented example below)
  - name: vm-runner
    box: bento/ubuntu-24.04
    memory: 2048
    config_options:
      ssh.keep_alive: yes
      ssh.remote_user: vagrant
    # Uncomment and modify if you want to hard-code the virtual switch name:
    # provider_raw_config_args:
    #   - "switch_name=Default Switch"
provisioner:
  name: ansible
  log: true
  env:
    ANSIBLE_ROLES_PATH: "roles/"
  playbooks:
    converge: ../resources/playbooks/converge.yml
    prepare: ../resources/playbooks/prepare.yml
    verify: ../resources/playbooks/verify.yml
verifier:
  name: ansible
