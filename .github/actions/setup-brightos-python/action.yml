name: Set up BrightOS Python environment
description: Create the repository virtualenv and install the Python and Ansible dependencies used by CI.

runs:
  using: composite
  steps:
    - name: Create Python virtual environment
      shell: bash
      run: |
        python -m venv .venv
        . .venv/bin/activate
        python -m pip install --upgrade pip
        # Pinned to the tested combination: molecule 26.x (ansible-native
        # config format) with ansible-core 2.18+ (Molecule N/N-1 policy).
        # ansible-core 2.17 is excluded by molecule itself (!=2.17.*).
        pip install 'molecule>=26,<27' 'molecule-plugins[docker]' \
            'ansible-core>=2.18' ansible-lint yamllint testinfra jmespath pyyaml

    - name: Install Ansible collections
      shell: bash
      run: |
        . .venv/bin/activate
        ansible-galaxy collection install -r requirements.yml
